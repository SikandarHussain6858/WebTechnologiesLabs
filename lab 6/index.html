<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animation Widgets - Lab 6</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <!-- Animation 1: Pac-Man -->
        <div class="widget">
            <div class="animation-box">
                <div class="pacman-wrap">
                    <div class="jaw-top"></div>
                    <div class="jaw-bot"></div>
                </div>
                <div class="dot dot1"></div>
                <div class="dot dot2"></div>
                <div class="dot dot3"></div>
            </div>
        </div>

        <!-- Animation 2: Bouncing Ball -->
        <div class="widget">
            <div class="animation-box">
                <div class="ball"></div>
                <div class="ball-shadow"></div>
            </div>
        </div>

        <!-- Animation 3: Rotating Square -->
        <div class="widget">
            <div class="animation-box">
                <div class="rot-square"></div>
            </div>
        </div>

        <!-- Animation 4: Pulsing Heart -->
        <div class="widget">
            <div class="animation-box">
                <div class="heart"></div>
            </div>
        </div>

        <!-- Animation 5: Loading Spinner -->
        <div class="widget">
            <div class="animation-box">
                <div class="spinner"></div>
            </div>
        </div>

    </div>
</body>
</html>
